name: Inner Pathway website

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# Only an explicit main-branch push may publish to the production GitHub Pages site.
# Staging pushes run validations, while CT146 deploys an independent local preview.
concurrency:
  group: inner-pathway-website-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site
    runs-on: [self-hosted, Linux, X64, hamblett, normal-ci, github]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate website
        run: python3 scripts/validate-site.py

      - name: Check no staging-to-production deployment path
        run: python3 scripts/check-deployment-isolation.py

  deploy:
    name: Deploy production-only GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, Linux, X64, hamblett, normal-ci, github]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out live main
        uses: actions/checkout@v7
        with:
          ref: main
          path: source-main

      - name: Build production-only artifact
        run: >-
          python3 source-main/scripts/build-pages.py
          --live source-main
          --output _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload production-only static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v5
