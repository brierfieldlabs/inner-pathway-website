name: Inner Pathway website

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# Live and staging share one Pages artifact, so never let deployments race.
concurrency:
  group: inner-pathway-website-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site
    runs-on: [self-hosted, Linux, X64, hamblett, normal-ci, github]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate website
        run: python3 scripts/validate-site.py

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    needs: validate
    runs-on: [self-hosted, Linux, X64, hamblett, normal-ci, github]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out live source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source-main

      - name: Check out staging source
        uses: actions/checkout@v7
        with:
          ref: staging
          path: source-staging

      - name: Build combined live and staging artifact
        run: >-
          python3 source-main/scripts/build-pages.py
          --live source-main
          --staging source-staging
          --output _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload combined static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
